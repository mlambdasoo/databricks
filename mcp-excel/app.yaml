command:
  - "python"
  - "app.py"

env:
  - name: "EXCEL_CACHE_DIR"
    value: "/tmp/excel_cache"
  - name: "LOG_LEVEL"
    value: "INFO"

# NOTE: user_api_scopes 는 app.yaml 로 적용되지 않는다.
#       Databricks Apps 의 메타 설정이며 `databricks apps update --json @app-update.json`
#       으로 등록해야 effective 가 된다 (app-update.json 참조).
#
# 현재 declared scopes (app-update.json 에서 관리):
#   - files.files            : /api/2.0/fs/files/... (UC Volume 파일 read/write API)
#   - catalog.catalogs:read  : /Volumes/<catalog>/... 경로의 catalog lookup 통과용
#                              (files.files 만으로는 UC Volume 접근 시 403 발생)
